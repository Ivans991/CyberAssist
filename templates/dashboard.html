<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CyberAssist - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/estilos.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/inicio">CyberAssist</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/inicio">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="/activos">Activos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/vulnerabilidades">Vulnerabilidades</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/dashboard-view">Dashboard</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Dashboard de Seguridad</h1>

        <div class="row mt-4 g-3">
            <div class="col-sm-6 col-lg-3">
                <div class="card text-white bg-secondary">
                    <div class="card-body text-center">
                        <h6 class="card-title">Total de Activos</h6>
                        <p class="display-6" id="total-activos">-</p>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-lg-3">
                <div class="card text-white bg-dark">
                    <div class="card-body text-center">
                        <h6 class="card-title">Total de Vulnerabilidades</h6>
                        <p class="display-6" id="total-vulnerabilidades">-</p>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-lg-3">
                <div class="card text-white bg-danger">
                    <div class="card-body text-center">
                        <h6 class="card-title">Riesgos Críticos</h6>
                        <p class="display-6" id="riesgos-criticos">-</p>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-lg-3">
                <div class="card text-white bg-warning">
                    <div class="card-body text-center">
                        <h6 class="card-title">Riesgos Altos</h6>
                        <p class="display-6" id="riesgos-altos">-</p>
                    </div>
                </div>
            </div>
        </div>

        <h3 class="mt-5">Distribución de riesgo (vulnerabilidades activas)</h3>
        <div class="progress mt-3" style="height: 30px;" id="barra-riesgo">
        </div>
        <div class="mt-2">
            <span class="badge bg-danger">Crítico</span>
            <span class="badge bg-warning text-dark">Alto</span>
            <span class="badge bg-info text-dark">Medio</span>
            <span class="badge bg-success">Bajo</span>
        </div>

        <div class="mt-4">
            <a href="/reportes/pdf" class="btn btn-outline-dark" target="_blank">Descargar informe PDF</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
