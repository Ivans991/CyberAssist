<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CyberAssist - Activos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/estilos.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/inicio">CyberAssist</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/inicio">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/activos">Activos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/vulnerabilidades">Vulnerabilidades</a></li>
                    <li class="nav-item"><a class="nav-link" href="/dashboard-view">Dashboard</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Gestión de Activos</h1>

        <h3 class="mt-4">Crear nuevo activo</h3>
        <form id="form-activo" class="row g-2">
            <input type="hidden" id="activo-id-editar" value="">
            <div class="col-sm-4"><input class="form-control" name="codigo" placeholder="Código" required></div>
            <div class="col-sm-4"><input class="form-control" name="tipo" placeholder="Tipo" required></div>
            <div class="col-sm-4"><input class="form-control" name="clasificacion" placeholder="Clasificación" required></div>
            <div class="col-sm-4"><input class="form-control" name="nombre" placeholder="Nombre" required></div>
            <div class="col-sm-4"><input class="form-control" name="marca_modelo" placeholder="Marca/Modelo"></div>
            <div class="col-sm-4"><input class="form-control" name="ubicacion" placeholder="Ubicación" required></div>
            <div class="col-sm-4"><input class="form-control" name="responsable" placeholder="Responsable" required></div>
            <div class="col-sm-4"><input class="form-control" name="funcion" placeholder="Función" required></div>
            <div class="col-sm-4"><input class="form-control" name="sistema_operativo" placeholder="Sistema Operativo"></div>
            <div class="col-sm-4"><input class="form-control" name="informacion_procesada" placeholder="Info. Procesada"></div>
            <div class="col-sm-4"><input class="form-control" name="direccion_ip" placeholder="Dirección IP"></div>
            <div class="col-sm-4">
                <select class="form-select" name="criticidad" required>
                    <option value="">Criticidad...</option>
                    <option value="Baja">Baja</option>
                    <option value="Media">Media</option>
                    <option value="Alta">Alta</option>
                    <option value="Crítica">Crítica</option>
                </select>
            </div>
            <div class="col-sm-4"><input class="form-control" name="observaciones" placeholder="Observaciones"></div>
            <div class="col-sm-4"><input class="form-control" name="estado" placeholder="Estado" required></div>
            <div class="col-sm-4">
                <button type="submit" class="btn btn-primary w-100">Crear Activo</button>
            </div>
        </form>

        <div id="mensaje" class="mt-2"></div>

        <h3 class="mt-5">Inventario de Activos</h3>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Código</th><th>Nombre</th><th>Tipo</th><th>Criticidad</th><th>Estado</th><th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-activos"></tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/activos.js?v=2"></script>
</body>
</html>
