<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CyberAssist - Vulnerabilidades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/estilos.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/inicio">CyberAssist</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/inicio">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="/activos">Activos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/vulnerabilidades">Vulnerabilidades</a></li>
                    <li class="nav-item"><a class="nav-link" href="/dashboard-view">Dashboard</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Gestión de Vulnerabilidades</h1>

        <h3 class="mt-4">Registrar nueva vulnerabilidad</h3>
        <form id="form-vulnerabilidad" class="row g-2">
            <input type="hidden" id="vulnerabilidad-id-editar" value="">
            <div class="col-sm-4">
                <select class="form-select" name="activo_id" id="select-activo" required>
                    <option value="">Selecciona un activo...</option>
                </select>
            </div>
            <div class="col-sm-4"><input class="form-control" name="nombre" placeholder="Nombre de la vulnerabilidad" required></div>
            <div class="col-sm-4">
                <select class="form-select" name="severidad" required>
                    <option value="">Severidad...</option>
                    <option value="Baja">Baja</option>
                    <option value="Media">Media</option>
                    <option value="Alta">Alta</option>
                    <option value="Crítica">Crítica</option>
                </select>
            </div>
            <div class="col-sm-4"><input class="form-control" name="descripcion" placeholder="Descripción"></div>
            <div class="col-sm-4"><input class="form-control" name="evidencia" placeholder="Evidencia"></div>
            <div class="col-sm-4"><input class="form-control" type="date" name="fecha_identificacion" required></div>
            <div class="col-sm-4">
                <select class="form-select" name="estado" required>
                    <option value="Abierta">Abierta</option>
                    <option value="En tratamiento">En tratamiento</option>
                    <option value="Cerrada">Cerrada</option>
                </select>
            </div>
            <div class="col-sm-4">
                <button type="submit" class="btn btn-primary w-100">Registrar Vulnerabilidad</button>
            </div>
        </form>

        <div id="mensaje" class="mt-2"></div>

        <h3 class="mt-5">Vulnerabilidades registradas</h3>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Activo</th><th>Nombre</th><th>Severidad</th><th>Riesgo</th><th>Recomendación</th><th>Estado</th><th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-vulnerabilidades"></tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/vulnerabilidades.js"></script>
</body>
</html>
